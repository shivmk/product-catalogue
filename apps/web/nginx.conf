server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # The browser only ever talks to this origin; product data and enquiries go via our API.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets never change, so cache them for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths serve index.html and React Router takes over.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-Frame-Options "DENY";
    # Product images come from Fake Store's image host; fonts from Google Fonts.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://fakestoreapi.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    try_files $uri /index.html;
  }
}
